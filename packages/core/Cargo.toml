[package]
name = "treease-core"
version = "1.1.0"
edition = "2024"
description = "Core parsing, evaluation, formatting, and graph runtime for Treease"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/loggerhead/treease"
homepage = "https://github.com/loggerhead/treease"
documentation = "https://github.com/loggerhead/treease/tree/main/packages/core"
keywords = ["treease", "tree-sitter", "structured-data", "yaml", "json"]
categories = ["parser-implementations", "parsing"]

[package.metadata.treease]
# YYMMDDHH
# YY: two-digit year
# MM: two-digit month
# DD: two-digit day of month
# HH: two-digit hour in 24-hour time
wasm_release_date = "26070510"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsify = "0.4.5"
wasm-bindgen = "0.2.121"
serde-wasm-bindgen = "0.6"
tree-sitter = "0.26.9"
tree-sitter-language = "0.1.7"
tree-sitter-javascript = { package = "treease-ts-javascript", version = "0.25.1" }
tree-sitter-yaml = { package = "treease-ts-yaml", version = "0.7.3" }
tree-sitter-toml-ng = { package = "treease-ts-toml", version = "0.7.1" }
tree-sitter-python = { package = "treease-ts-python", version = "0.25.1" }

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
[[bin]]
name = "corpus_runner_helper"
path = "tests/support/corpus_runner_helper.rs"
test = false

[[bin]]
name = "export_registry_doc"
path = "src/tools/export_registry_doc.rs"
test = false

[[bin]]
name = "export_language_support"
path = "src/tools/export_language_support.rs"
test = false

[[bin]]
name = "export_document_protocol"
path = "src/tools/export_document_protocol.rs"
test = false

[[bin]]
name = "sync_examples"
path = "src/tools/sync_examples.rs"
test = false
