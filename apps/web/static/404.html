<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Treease</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 520px);
        padding: 40px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 54px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      .brand {
        color: #2563eb;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 { margin: 18px 0 10px; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; }
      p { margin: 0; color: #64748b; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
      a { border-radius: 8px; padding: 10px 16px; color: #fff; background: #2563eb; font-size: 14px; font-weight: 600; text-decoration: none; }
      a.secondary { color: #2563eb; background: #eff6ff; }
      a:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.35); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Treease</div>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or may have moved.</p>
      <nav aria-label="Recovery options">
        <a href="/">Back to home</a>
        <a class="secondary" href="/editor">Open editor</a>
      </nav>
    </main>
  </body>
</html>
