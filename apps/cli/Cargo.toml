[package]
name = "treease-cli"
version = "1.0.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = []
lite = ["treease-core/lite"]

[dependencies]
clap = { version = "4.6.1", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
treease-core = { path = "../../packages/core" }

[[bin]]
name = "treease"
path = "src/main.rs"
test = false

[[bin]]
name = "export_cli_metadata"
path = "src/bin/export_cli_metadata.rs"
test = false
