name: Setup Web
description: Install Zig, Node, pnpm, and wasm-pack for web builds

inputs:
  zig-version:
    description: Zig version to install
    required: true

runs:
  using: composite
  steps:
    - name: Install Zig
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.zig-version }}"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) zig_arch="x86_64-linux" ;;
          aarch64|arm64) zig_arch="aarch64-linux" ;;
          *)
            echo "Unsupported architecture: $arch" >&2
            exit 1
            ;;
        esac
        install_dir="$RUNNER_TEMP/zig-$version"
        archive="$RUNNER_TEMP/zig-$version.tar.xz"
        curl -fsSL "https://ziglang.org/download/$version/zig-$zig_arch-$version.tar.xz" -o "$archive"
        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        tar -xJf "$archive" --strip-components=1 -C "$install_dir"
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/zig" version
    - uses: pnpm/action-setup@v5
      with:
        version: 9
        run_install: false
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/web/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: apps/web
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      shell: bash
