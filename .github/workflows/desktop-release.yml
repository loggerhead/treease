name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            args: ""
          - runner: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # No paid Apple certificate is used for the Developer Preview build.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Install Zig on macOS
        if: matrix.runner == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          version=0.16.0
          install_dir="$RUNNER_TEMP/zig-$version"
          archive="$RUNNER_TEMP/zig-$version.tar.xz"
          curl -fsSL "https://ziglang.org/download/$version/zig-aarch64-macos-$version.tar.xz" -o "$archive"
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -xJf "$archive" --strip-components=1 -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/zig" version
      - name: Install Zig on Windows
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          $version = '0.16.0'
          $archive = Join-Path $env:RUNNER_TEMP "zig-$version.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP "zig-$version"
          Invoke-WebRequest "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip" -OutFile $archive
          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Move-Item (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$version") $installRoot
          Add-Content $env:GITHUB_PATH $installRoot
          & (Join-Path $installRoot 'zig.exe') version
      - name: Use Bash Zig wrapper on Windows
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "CC_wasm32_unknown_unknown=cmd /c $env:GITHUB_WORKSPACE/scripts/zig-wasm32-cc.cmd"
          Add-Content $env:GITHUB_ENV "AR_wasm32_unknown_unknown=cmd /c $env:GITHUB_WORKSPACE/scripts/wasm32-ar.cmd"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Run Windows desktop E2E
        if: matrix.runner == 'windows-latest'
        working-directory: apps/desktop
        run: pnpm test:e2e
      - name: Build and publish signed Developer Preview artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Treease Desktop Developer Preview v__VERSION__
          releaseBody: Developer Preview. macOS builds use ad-hoc signing and may require explicit system approval.
          # Cask downloads the public release asset directly, so it cannot
          # depend on a draft release. Keep the Developer Preview marker.
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

  update-homebrew-tap:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v5
      - name: Read Desktop release metadata
        id: meta
        run: node scripts/release-metadata.mjs --github-output >> "$GITHUB_OUTPUT"
      - name: Request Homebrew tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: loggerhead/homebrew-treease
          event-type: treease-desktop-release
          client-payload: >-
            {"version":"${{ steps.meta.outputs.desktopVersion }}",
            "tag":"${{ steps.meta.outputs.desktopReleaseTag }}",
            "asset":"Treease_${{ steps.meta.outputs.desktopVersion }}_aarch64.dmg"}
