name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: 0.16.0
      - name: Pin wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Generate desktop WASM package
        run: pnpm --dir apps/web wasm:bindgen
      - name: Generate language support
        run: pnpm --dir apps/web wasm:language-support
      - name: Validate desktop WASM package
        run: pnpm --dir apps/web wasm:validate
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-wasm-package
          path: packages/core/wasm/pkg
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare-web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            args: ""
          - runner: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TREEASE_SKIP_WASM_BINDGEN: "1"
      # No paid Apple certificate is used for the Developer Preview build.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: desktop-wasm-package
          path: packages/core/wasm/pkg
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - name: Run Windows desktop E2E
        if: matrix.runner == 'windows-latest'
        working-directory: apps/desktop
        run: pnpm test:e2e
      - name: Build and publish signed Developer Preview artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Treease Desktop Developer Preview v__VERSION__
          releaseBody: Developer Preview. macOS builds use ad-hoc signing and may require explicit system approval.
          # Cask downloads the public release asset directly, so it cannot
          # depend on a draft release. Keep the Developer Preview marker.
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

  update-homebrew-tap:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v5
      - name: Read Desktop release metadata
        id: meta
        run: node scripts/release-metadata.mjs --github-output >> "$GITHUB_OUTPUT"
      - name: Request Homebrew tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: loggerhead/homebrew-treease
          event-type: treease-desktop-release
          client-payload: >-
            {"version":"${{ steps.meta.outputs.desktopVersion }}",
            "tag":"${{ steps.meta.outputs.desktopReleaseTag }}",
            "asset":"Treease_${{ steps.meta.outputs.desktopVersion }}_aarch64.dmg"}
