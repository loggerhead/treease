name: Web Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

env:
  ZIG_VERSION: 0.16.0

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Build WASM
        run: pnpm wasm:bindgen && pnpm wasm:sync
        working-directory: ${{ github.workspace }}/apps/web
      - name: Run unit & integration tests with coverage
        run: pnpm test:coverage
        working-directory: ${{ github.workspace }}/apps/web
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 14

  web-e2e:
    runs-on: ubuntu-latest
    needs: [web-test]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Build WASM
        run: pnpm wasm:bindgen && pnpm wasm:sync
        working-directory: ${{ github.workspace }}/apps/web
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        working-directory: ${{ github.workspace }}/apps/web
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        working-directory: ${{ github.workspace }}/apps/web
      - name: Run E2E core tests
        id: e2e-core
        continue-on-error: true
        run: pnpm test:e2e:core
        working-directory: ${{ github.workspace }}/apps/web
      - name: Re-run failed E2E core tests serially
        id: e2e-core-rerun
        if: steps.e2e-core.outcome == 'failure'
        continue-on-error: true
        run: pnpm exec playwright test --config playwright.config.core.ts --last-failed --workers=1
        working-directory: ${{ github.workspace }}/apps/web
      - name: Upload Playwright traces
        if: always() && (steps.e2e-core.outcome == 'failure' || steps.e2e-core-rerun.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
      - name: Fail job if E2E retry did not recover
        if: steps.e2e-core.outcome == 'failure' && steps.e2e-core-rerun.outcome != 'success'
        run: exit 1
