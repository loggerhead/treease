name: Web Tests

on:
  workflow_call:

env:
  ZIG_VERSION: 0.16.0

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Build WASM
        run: pnpm wasm:bindgen && pnpm wasm:sync
        working-directory: ${{ github.workspace }}/apps/web
      - name: Run unit & integration tests with coverage
        run: pnpm test:coverage
        working-directory: ${{ github.workspace }}/apps/web
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 14

  web-e2e:
    runs-on: ubuntu-latest
    needs: [web-test, web-e2e-build]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-web
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Download E2E build
        uses: actions/download-artifact@v4
        with:
          name: web-e2e-build
          path: apps/web/build
      - name: Detect Playwright version
        id: playwright-version
        working-directory: ${{ github.workspace }}/apps/web
        run: |
          PLAYWRIGHT_VERSION="$(pnpm exec playwright --version | awk '{print $2}')"
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        working-directory: ${{ github.workspace }}/apps/web
      - name: Check Playwright browser executable
        id: playwright-browser-check
        working-directory: ${{ github.workspace }}/apps/web
        run: |
          EXECUTABLE_PATH="$(pnpm exec node -e "const { chromium } = require('@playwright/test'); process.stdout.write(chromium.executablePath())")"
          if [ -x "$EXECUTABLE_PATH" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Playwright browsers
        if: steps.playwright-browser-check.outputs.exists != 'true'
        run: pnpm exec playwright install chromium
        working-directory: ${{ github.workspace }}/apps/web
      - name: Run E2E core tests
        id: e2e-core
        continue-on-error: true
        run: pnpm test:e2e:core:run
        working-directory: ${{ github.workspace }}/apps/web
      - name: Re-run failed E2E core tests serially
        id: e2e-core-rerun
        if: steps.e2e-core.outcome == 'failure'
        continue-on-error: true
        run: pnpm exec playwright test --config playwright.config.core.ts --last-failed --workers=1
        working-directory: ${{ github.workspace }}/apps/web
      - name: Upload Playwright traces
        if: always() && (steps.e2e-core.outcome == 'failure' || steps.e2e-core-rerun.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
      - name: Fail job if E2E retry did not recover
        if: steps.e2e-core.outcome == 'failure' && steps.e2e-core-rerun.outcome != 'success'
        run: exit 1

  web-e2e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Cache E2E build
        id: e2e-build-cache
        uses: actions/cache@v4
        with:
          path: apps/web/build
          key: web-e2e-build-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'apps/web/pnpm-lock.yaml', 'apps/web/src/**', 'apps/web/static/**', 'apps/web/scripts/**', 'apps/web/svelte.config.js', 'apps/web/vite.config.ts', 'apps/web/tsconfig.json', 'scripts/release-metadata.mjs', 'packages/core/Cargo.toml', 'packages/core/Cargo.lock', 'packages/core/src/**', 'packages/core/wasm/**', 'packages/core/build.rs') }}
      - name: Build E2E artifact
        if: steps.e2e-build-cache.outputs.cache-hit != 'true'
        run: pnpm build:e2e
        working-directory: ${{ github.workspace }}/apps/web
      - name: Upload E2E build
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-build
          path: apps/web/build
          if-no-files-found: error
          retention-days: 1
