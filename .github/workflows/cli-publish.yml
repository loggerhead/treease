name: CLI Publish

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cli-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read package metadata
        id: meta
        run: node scripts/release-metadata.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: Check tag matches CLI version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "${{ steps.meta.outputs.cliReleaseTag }}"

      - name: Check whether CLI release already exists
        id: exists
        shell: bash
        run: |
          url="https://crates.io/api/v1/crates/${{ steps.meta.outputs.cliName }}/${{ steps.meta.outputs.cliVersion }}"
          status="$(curl -fsS -o /dev/null -w '%{http_code}' "$url" || true)"
          echo "exists=$([[ "$status" = 200 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Wait for core crate to be available
        shell: bash
        run: |
          url="https://crates.io/api/v1/crates/${{ steps.meta.outputs.coreName }}/${{ steps.meta.outputs.coreVersion }}"
          for attempt in $(seq 1 30); do
            status="$(curl -fsS -A "treease-cli-release-workflow" -o /dev/null -w '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "core crate did not become visible on crates.io: $url" >&2
          exit 1

      - name: Verify package
        if: steps.exists.outputs.exists != 'true'
        working-directory: apps/cli
        run: cargo publish --dry-run --locked

      - name: Verify deployed CLI assets
        working-directory: apps/web
        run: node scripts/check-cli-assets.mjs --remote-only

      - name: Authenticate to crates.io
        if: steps.exists.outputs.exists != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: steps.exists.outputs.exists != 'true'
        working-directory: apps/cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
