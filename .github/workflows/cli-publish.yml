name: CLI Publish

on:
  push:
    tags:
      - "treease-cli-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cli-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: 0.16.0

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("apps/cli/Cargo.toml", "rb") as f:
              package = tomllib.load(f)["package"]
          print(f'name={package["name"]}')
          print(f'version={package["version"]}')
          PY

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "treease-cli-v${{ steps.meta.outputs.version }}"

      - name: Verify package
        working-directory: apps/cli
        run: cargo publish --dry-run --locked

      - name: Build web cli-assets and verify deployed assetVersion
        working-directory: apps/web
        run: pnpm build && pnpm cli-assets:check

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        working-directory: apps/cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
