name: Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - packages/core/**
      - packages/share-protocol/**
      - scripts/release-metadata.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/actions/setup-rust/**
      - .github/actions/setup-web/**
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      VITE_GA_CONSENT_REQUIRED: ${{ vars.VITE_GA_CONSENT_REQUIRED }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Deploy production web bundle
        working-directory: apps/web
        run: pnpm build && pnpm assets:r2:check && npx wrangler pages deploy build --project-name treease --branch main && pnpm cli-assets:check
