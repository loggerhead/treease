name: Deploy Web Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/release-metadata.mjs'
      - '.github/actions/setup-rust/**'
      - '.github/actions/setup-web/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

concurrency:
  group: treease-web-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Rust and Cargo cache
        uses: ./.github/actions/setup-rust

      - name: Set up Web dependencies and WASM tools
        uses: ./.github/actions/setup-web
        with:
          zig-version: 0.16.0

      - name: Build Web Worker
        working-directory: apps/web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_CONSENT_REQUIRED: ${{ secrets.GA_CONSENT_REQUIRED }}
          PUBLIC_PRICING_MONTHLY_PRICE: ${{ secrets.PUBLIC_PRICING_MONTHLY_PRICE }}
          PUBLIC_PRICING_YEARLY_PRICE: ${{ secrets.PUBLIC_PRICING_YEARLY_PRICE }}
        run: pnpm build

      - name: Sync public R2 assets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TREEASE_R2_ASSET_BUCKET: treease-assets
        run: pnpm assets:r2:sync

      - name: Deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
