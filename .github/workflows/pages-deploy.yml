name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0

concurrency:
  group: pages-production-deploy
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Build WASM
        run: pnpm wasm:bindgen && pnpm wasm:sync
        working-directory: ${{ github.workspace }}/apps/web
      - name: Run unit tests
        run: pnpm test:unit
        working-directory: ${{ github.workspace }}/apps/web

  deploy-production:
    runs-on: ubuntu-latest
    needs: verify-web
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Deploy to Cloudflare Pages production
        run: pnpm build && pnpm assets:r2:check && npx wrangler pages deploy build --project-name treease --branch main
        working-directory: ${{ github.workspace }}/apps/web
