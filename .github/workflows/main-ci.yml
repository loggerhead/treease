name: Main CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  core-test:
    uses: ./.github/workflows/core.yml

  web:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/web.yml

  server:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify server Worker configuration
        run: node scripts/server-deploy-check.mjs
      - name: Run server checks
        run: pnpm server:check
      - name: Run server tests
        run: pnpm server:test
      - name: Run Node server smoke check
        run: pnpm server:smoke
      - name: Run Cloudflare Worker smoke check
        run: pnpm server:worker:smoke
