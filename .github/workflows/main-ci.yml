name: Main CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.paths.outputs.web }}
      server: ${{ steps.paths.outputs.server }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect deploy paths
        id: paths
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/web/|packages/core/|packages/share-protocol/|apps/web/pnpm-lock.yaml$|scripts/release-metadata\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/actions/setup-(rust|web)/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(apps/server/|packages/share-protocol/|scripts/server-.*\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi

  core-test:
    uses: ./.github/workflows/core.yml

  web:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/web.yml

  deploy-server:
    if: always() && (github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch' && needs.changes.outputs.server == 'true')
    runs-on: ubuntu-latest
    needs: changes
    environment: Production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify server deploy prerequisites
        run: node scripts/server-deploy-check.mjs
      - name: Run server checks
        run: pnpm server:check
      - name: Run server tests
        run: pnpm server:test
      - name: Run Node server smoke check
        run: pnpm server:smoke
      - name: Run Cloudflare Worker smoke check
        run: pnpm server:worker:smoke
      - name: Deploy production Worker
        run: pnpm --dir apps/server worker:deploy
