name: Unified Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0
  CRATES_IO_API_USER_AGENT: treease-release-workflow (+https://github.com/loggerhead/treease)

permissions:
  contents: read

concurrency:
  group: unified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      core_name: ${{ steps.meta.outputs.coreName }}
      core_version: ${{ steps.meta.outputs.coreVersion }}
      core_wasm_release_date: ${{ steps.meta.outputs.coreWasmReleaseDate }}
      core_release_tag: ${{ steps.meta.outputs.coreReleaseTag }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read release metadata
        id: meta
        run: node scripts/release-metadata.mjs --github-output >> "$GITHUB_OUTPUT"
      - name: Check tag matches core version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "${{ steps.meta.outputs.coreReleaseTag }}"

  publish-core:
    runs-on: ubuntu-latest
    needs: metadata
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - name: Check crates.io for existing core release
        id: exists
        shell: bash
        run: |
          url="https://crates.io/api/v1/crates/${{ needs.metadata.outputs.core_name }}/${{ needs.metadata.outputs.core_version }}"
          status="$(curl -fsS -A "$CRATES_IO_API_USER_AGENT" -o /dev/null -w '%{http_code}' "$url" || true)"
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify core package
        if: steps.exists.outputs.exists != 'true'
        working-directory: packages/core
        run: cargo publish --dry-run --locked
      - name: Authenticate to crates.io
        if: steps.exists.outputs.exists != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish core crate
        if: steps.exists.outputs.exists != 'true'
        working-directory: packages/core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Wait for crates.io index to expose core release
        shell: bash
        run: |
          url="https://crates.io/api/v1/crates/${{ needs.metadata.outputs.core_name }}/${{ needs.metadata.outputs.core_version }}"
          for attempt in $(seq 1 30); do
            status="$(curl -fsS -A "$CRATES_IO_API_USER_AGENT" -o /dev/null -w '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "core crate did not become visible on crates.io: $url" >&2
          exit 1

  deploy-web:
    runs-on: ubuntu-latest
    needs: [metadata, publish-core]
    environment: Production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      VITE_GA_CONSENT_REQUIRED: ${{ vars.VITE_GA_CONSENT_REQUIRED }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-web
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Deploy release web bundle and CLI assets
        working-directory: apps/web
        run: pnpm build && pnpm assets:r2:check && pnpm exec wrangler pages deploy build --project-name treease --branch main && pnpm cli-assets:check
