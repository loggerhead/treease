name: Server Deploy

on:
  push:
    branches:
      - main
    paths:
      - apps/server/**
      - packages/share-protocol/**
      - scripts/server-*.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify server deploy prerequisites
        run: node scripts/server-deploy-check.mjs
      - name: Run server checks
        run: pnpm server:check
      - name: Run server tests
        run: pnpm server:test
      - name: Run Node server smoke check
        run: pnpm server:smoke
      - name: Run Cloudflare Worker smoke check
        run: pnpm server:worker:smoke
      - name: Deploy production Worker
        run: pnpm --dir apps/server worker:deploy
